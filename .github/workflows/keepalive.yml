name: 24/7 Streamlit App Keep-Alive Pinger

on:
  schedule:
    # Triggered automatically every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Health Endpoint
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ APP_URL secret is not set yet in GitHub Secrets."
            echo "Please go to Repo Settings -> Secrets and variables -> Actions -> New repository secret -> APP_URL"
            exit 0
          fi
          
          HEALTH_URL="${TARGET_URL%/}/_stcore/health"
          echo "🚀 Pinging $HEALTH_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || true)
          echo "Response code: $HTTP_STATUS"
          
          # Also ping main root URL
          echo "🚀 Pinging main URL: $TARGET_URL..."
          MAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET_URL" || true)
          echo "Main response code: $MAIN_STATUS"
          
          echo "✅ Keep-alive pulse completed successfully at $(date -u)"
